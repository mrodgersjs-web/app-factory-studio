name: Feature request
about: Sketch the smallest useful change
title: "[feature] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        The factory is intentionally narrow. New templates, new template
        fields, or new commands belong here. The bar is a real runnable
        artefact and a test that proves it.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving?
      description: One or two plain sentences on the gap.
      render: text
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Smallest useful shape
      description: >
        The smallest API or template change that would make the problem go
        away. Avoid UI for its own sake.
      render: text
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Who benefits, and how would you measure it?
      description: Optional. Brief sketch of users and a measurable signal.
      render: text

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What you considered and why this is the smallest fix.
      render: text
