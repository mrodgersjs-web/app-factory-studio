[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-factory"
version = "0.3.0"
description = "Spec paragraph to a generated, tested app behind a proof gate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mike Rodgers" }]
keywords = ["scaffolding", "code-generator", "testing", "cli", "sqlite", "stdlib-only"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []
[project.optional-dependencies]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "ruff>=0.6"]
[project.scripts]
app-factory = "app_factory.cli:main"
[project.urls]
Homepage = "https://github.com/mrodgersjs-web/app-factory-studio"
Repository = "https://github.com/mrodgersjs-web/app-factory-studio"
Issues = "https://github.com/mrodgersjs-web/app-factory-studio/issues"
Changelog = "https://github.com/mrodgersjs-web/app-factory-studio/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
